<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#1a1a1a;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:0 12px;height:48px;background:#fff;border-bottom:1px solid #e0e0e0;flex-shrink:0}
header h1{font-size:15px;font-weight:500}
.toggle-btn{background:none;border:none;cursor:pointer;font-size:16px;color:#666;padding:6px 8px;border-radius:8px;transition:background .15s;display:flex;align-items:center;justify-content:center}
.toggle-btn:hover{background:#f0f0f0}
.layout{display:flex;flex:1;overflow:hidden}
aside.panel{width:220px;background:#fff;border-right:1px solid #e0e0e0;display:flex;flex-direction:column;transition:width .2s,opacity .2s;flex-shrink:0}
aside.panel.collapsed{width:0;opacity:0;overflow:hidden}
.panel-header{font-size:11px;font-weight:600;color:#888;padding:10px 12px;border-bottom:1px solid #e0e0e0;letter-spacing:.06em;text-transform:uppercase}
.panel-body{flex:1;overflow-y:auto;padding:8px}
main.chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.chat-header{font-size:14px;font-weight:500;padding:10px 16px;border-bottom:1px solid #e0e0e0;background:#fff}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.message{display:flex;flex-direction:column;max-width:70%}
.message.outgoing{align-self:flex-end;align-items:flex-end}
.message.incoming{align-self:flex-start;align-items:flex-start}
.sender{font-size:11px;color:#888;margin-bottom:3px}
.bubble{padding:8px 12px;border-radius:14px;font-size:13px;line-height:1.5}
.outgoing .bubble{background:#0084ff;color:#fff;border-bottom-right-radius:4px}
.incoming .bubble{background:#e4e6eb;color:#1a1a1a;border-bottom-left-radius:4px}
.timestamp{font-size:10px;color:#aaa;margin-top:3px}
.input-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid #e0e0e0;background:#fff}
.input-bar input{flex:1;border:1px solid #ddd;border-radius:20px;padding:8px 14px;font-size:13px;background:#f0f2f5;color:#1a1a1a;outline:none;font-family:inherit}
.input-bar input:focus{border-color:#0084ff;background:#fff}
.send-btn{width:34px;height:34px;border-radius:50%;background:#0084ff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.send-btn svg{width:16px;height:16px;fill:#fff}
.convo-item{padding:10px 8px;border-radius:8px;cursor:pointer;transition:background .1s}
.convo-item:hover,.convo-item.active{background:#f0f2f5}
.convo-name{font-size:13px;font-weight:500}
.convo-preview{font-size:11px;color:#888;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convo-time{font-size:10px;color:#aaa;margin-top:2px}

/* Settings icon SVG button */
.icon-btn{background:none;border:none;cursor:pointer;color:#555;padding:6px 8px;border-radius:8px;transition:background .15s;display:flex;align-items:center;justify-content:center}
.icon-btn:hover{background:#f0f0f0}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:all}
.modal{background:#fff;border-radius:12px;border:1px solid #e0e0e0;width:480px;max-width:92vw;max-height:80vh;display:flex;flex-direction:column;transform:scale(.96);transition:transform .2s}
.overlay.open .modal{transform:scale(1)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #e0e0e0;flex-shrink:0}
.modal-header h2{font-size:15px;font-weight:600}
.modal-close{background:none;border:none;cursor:pointer;color:#888;padding:4px 8px;border-radius:8px;font-size:20px;line-height:1;transition:background .15s}
.modal-close:hover{background:#f0f0f0;color:#333}
.modal-body{flex:1;overflow-y:auto;padding:12px}
.modal-footer{padding:12px 16px;border-top:1px solid #e0e0e0;display:flex;justify-content:flex-end;flex-shrink:0}
.btn-add{background:none;border:1px solid #ddd;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer;color:#333;display:flex;align-items:center;gap:6px;transition:background .15s;font-family:inherit}
.btn-add:hover{background:#f0f2f5}
.char-list{display:flex;flex-direction:column;gap:4px}
.char-item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:8px;border:1px solid transparent;transition:background .1s,border-color .1s}
.char-item:hover{background:#f9f9f9;border-color:#e8e8e8}
.char-pfp{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0;border:1px solid rgba(0,0,0,.08)}
.char-name{flex:1;font-size:14px;font-weight:500}
.char-actions{display:flex;gap:2px}
.char-btn{background:none;border:none;cursor:pointer;color:#888;padding:6px;border-radius:7px;font-size:13px;transition:background .15s,color .15s;display:flex;align-items:center;justify-content:center}
.char-btn:hover{background:#f0f0f0;color:#333}
.char-btn.del:hover{background:#fef0f0;color:#d0392b}
.char-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.empty-state{text-align:center;padding:32px 16px;color:#aaa;font-size:13px}
</style>
</head>
<body>

<header>
  <button class="toggle-btn" id="toggleLeft" title="Toggle convos">☰</button>
  <h1>Chat</h1>
  <button class="icon-btn" id="openSettings" title="Settings" aria-label="Settings">
    <!-- gear icon -->
    <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<div class="layout">
  <aside class="panel" id="leftPanel">
    <div class="panel-header">Convos</div>
    <div class="panel-body">
      <div class="convo-item active">
        <div class="convo-name">Alice</div>
        <div class="convo-preview">sounds good, see you then</div>
        <div class="convo-time">2:34 PM</div>
      </div>
      <div class="convo-item">
        <div class="convo-name">Bob</div>
        <div class="convo-preview">let me know when you're free</div>
        <div class="convo-time">Yesterday</div>
      </div>
    </div>
  </aside>

  <main class="chat-area">
    <div class="chat-header">Alice</div>
    <div class="messages" id="messageList">
      <div class="message incoming">
        <div class="sender">Alice</div>
        <div class="bubble">Hey, are we still on for tomorrow?</div>
        <div class="timestamp">2:30 PM</div>
      </div>
      <div class="message outgoing">
        <div class="sender">You</div>
        <div class="bubble">Yeah, sounds good — see you then!</div>
        <div class="timestamp">2:34 PM</div>
      </div>
    </div>
    <div class="input-bar">
      <input type="text" placeholder="Type a message…" id="msgInput">
      <button class="send-btn" id="sendBtn">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>
  </main>
</div>

<!-- Settings overlay -->
<div class="overlay" id="settingsOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2>Settings — Characters</h2>
      <button class="modal-close" id="closeSettings" aria-label="Close">×</button>
    </div>
    <div class="modal-body">
      <div class="char-list" id="charList"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-add" id="addChar">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 5v14M5 12h14"/></svg>
        Add character
      </button>
    </div>
  </div>
</div>

<script>
const COLORS = [
  {bg:'#dbeafe',color:'#1e40af'},
  {bg:'#dcfce7',color:'#166534'},
  {bg:'#fef9c3',color:'#854d0e'},
  {bg:'#fce7f3',color:'#9d174d'},
  {bg:'#d1fae5',color:'#065f46'},
  {bg:'#ede9fe',color:'#4c1d95'},
  {bg:'#fee2e2',color:'#991b1b'},
];

let chars = [
  {id:1,name:'Alice',initials:'AL'},
  {id:2,name:'Bob',initials:'BO'},
  {id:3,name:'Commander Reyes',initials:'CR'},
];
let nextId = 4;

function colorFor(id){return COLORS[id % COLORS.length]}

function initials(name){
  const parts = name.trim().split(/\s+/);
  if(parts.length>=2) return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
  return name.slice(0,2).toUpperCase();
}

function iconSvg(type){
  const icons = {
    edit: '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>',
    copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
    trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>',
  };
  return `<svg viewBox="0 0 24 24">${icons[type]}</svg>`;
}

function renderChars(){
  const list = document.getElementById('charList');
  if(!chars.length){
    list.innerHTML='<div class="empty-state">No characters yet — add one below.</div>';
    return;
  }
  list.innerHTML = chars.map(c=>{
    const col = colorFor(c.id);
    return `<div class="char-item" data-id="${c.id}">
      <div class="char-pfp" style="background:${col.bg};color:${col.color}">${c.initials}</div>
      <div class="char-name">${c.name}</div>
      <div class="char-actions">
        <button class="char-btn" data-action="edit" data-id="${c.id}" title="Edit">${iconSvg('edit')}</button>
        <button class="char-btn" data-action="dupe" data-id="${c.id}" title="Duplicate">${iconSvg('copy')}</button>
        <button class="char-btn del" data-action="del" data-id="${c.id}" title="Delete">${iconSvg('trash')}</button>
      </div>
    </div>`;
  }).join('');
}

document.getElementById('charList').addEventListener('click',e=>{
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const id = parseInt(btn.dataset.id);
  const action = btn.dataset.action;
  if(action==='del'){
    if(confirm('Delete this character?')){
      chars = chars.filter(c=>c.id!==id);
      renderChars();
    }
  } else if(action==='dupe'){
    const orig = chars.find(c=>c.id===id);
    if(orig){
      const copy = {id:nextId++, name:orig.name+' (copy)', initials:orig.initials};
      const idx = chars.findIndex(c=>c.id===id);
      chars.splice(idx+1,0,copy);
      renderChars();
    }
  } else if(action==='edit'){
    const orig = chars.find(c=>c.id===id);
    if(!orig) return;
    const newName = prompt('Edit name:', orig.name);
    if(newName && newName.trim()){
      orig.name = newName.trim();
      orig.initials = initials(orig.name);
      renderChars();
    }
  }
});

document.getElementById('addChar').addEventListener('click',()=>{
  const name = prompt('Character name:');
  if(name && name.trim()){
    chars.push({id:nextId++, name:name.trim(), initials:initials(name.trim())});
    renderChars();
  }
});

document.getElementById('toggleLeft').addEventListener('click',()=>{
  document.getElementById('leftPanel').classList.toggle('collapsed');
});

const overlay = document.getElementById('settingsOverlay');
document.getElementById('openSettings').addEventListener('click',()=>{
  renderChars();
  overlay.classList.add('open');
});
document.getElementById('closeSettings').addEventListener('click',()=>overlay.classList.remove('open'));
overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')overlay.classList.remove('open')});

renderChars();

// basic send
document.getElementById('sendBtn').addEventListener('click',sendMsg);
document.getElementById('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});
function sendMsg(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text) return;
  const list = document.getElementById('messageList');
  const el = document.createElement('div');
  el.className='message outgoing';
  el.innerHTML=`<div class="sender">You</div><div class="bubble">${text}</div><div class="timestamp">${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>`;
  list.appendChild(el);
  list.scrollTop = list.scrollHeight;
  input.value='';
}
</script>
</body>
</html>
